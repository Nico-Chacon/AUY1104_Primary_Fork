name: Deploy to AWS K3S

on:
  workflow_dispatch:
    inputs:
      image-name:
        description: 'Nombre de la imagen'
        required: true
      image-tag:
        description: 'Tag de la imagen'
        required: true
      k3s-server-public-ip:
        description: 'IP pública del servidor K3S'
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # aquí van tus pasos de build/push de la imagen

  deploy-to-k8s:   # 👈 este bloque debe estar al mismo nivel que build-and-push
    name: Deploy to AWS K3S
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: 1 · SSH al servidor K3S
        run: ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" 'echo ok'

      - name: Checkout (manifiestos K8s)
        uses: actions/checkout@v4

      - name: Copiar k8s/ al servidor y aplicar
        run: |
          set -euo pipefail
          test -d k8s || { echo "::error::Falta carpeta k8s/ en la raíz del repo"; exit 1; }
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" 'sudo rm -rf /tmp/k8s-deploy'
          scp -o StrictHostKeyChecking=accept-new -r k8s "ubuntu@${{ inputs.k3s-server-public-ip}}:/tmp/k8s-deploy"
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip}}" \
            'sudo k3s kubectl apply -f /tmp/k8s-deploy/'

      - name: Verificar pods
        run: ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip}}" 'sudo k3s kubectl get pods -o wide'

      - name: Verificar rollout status
        run: ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip}}" \
          'sudo k3s kubectl rollout status deployment/demo-api --timeout=60s'

      - name: Rollback automático
        if: failure()
        run: ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip}}" \
          'sudo k3s kubectl rollout undo deployment/demo-api && sudo k3s kubectl rollout status deployment/demo-api --timeout=60s'
